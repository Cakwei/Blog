name: Unit Tests
on:
  push:
    branches: '**'
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'

      - name: Install dependencies
        run: npm i

      - name: Generate Prisma client
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'mariadb://root:pass@localhost:3306/blog' }}
        run: npx dotenv -e .env -- prisma generate

      - name: Run Unit Tests
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY || 're_mock_test_key' }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET || 'mock_secret_key_12345678901234567890' }}
          BETTER_AUTH_URL: ${{ secrets.BETTER_AUTH_URL || 'http://localhost:3000' }}
        run: npm test
